name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-images:
    name: Publish ${{ matrix.name }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            image: blukube-server
            dockerfile: Dockerfile
          - name: web
            image: blukube-web
            dockerfile: Dockerfile.web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-tui:
    name: Publish TUI artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore TUI project
        run: dotnet restore src/BluKube.Tui/BluKube.Tui.csproj

      - name: Publish self-contained TUI
        run: |
          dotnet publish src/BluKube.Tui/BluKube.Tui.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o artifacts/blukube-linux-x64

      - name: Package TUI artifact
        run: |
          tar -C artifacts/blukube-linux-x64 -czf artifacts/blukube-linux-x64.tar.gz .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: blukube-tui-linux-x64
          path: artifacts/blukube-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: Attach TUI to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - publish-images
      - publish-tui
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download TUI artifact
        uses: actions/download-artifact@v4
        with:
          name: blukube-tui-linux-x64
          path: release-artifacts

      - name: Build release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"

          sed \
            -e "s|{{OWNER}}|$owner_lc|g" \
            -e "s|{{TAG}}|$GITHUB_REF_NAME|g" \
            .github/workflows/release-notes.md > release-artifacts/release-notes.md

          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" \
            --jq .body > release-artifacts/generated-notes.md

          printf "\n\n## Changes\n\n" >> release-artifacts/release-notes.md
          cat release-artifacts/generated-notes.md >> release-artifacts/release-notes.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="$(cat release-artifacts/release-notes.md)"

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes "$notes"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes "$notes"
          fi

          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            release-artifacts/blukube-linux-x64.tar.gz \
            --clobber
