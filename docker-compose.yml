services:
  blukube:
    build:
      context: .
      dockerfile: Dockerfile
    image: blukube:latest
    container_name: blukube
    ports:
      - "${BLUKUBE_PORT:-8765}:8765"
    environment:
      - BLUKUBE_TOKEN=${BLUKUBE_TOKEN:-}
      - BLUKUBE_BIND=0.0.0.0:8765
    volumes:
      - blukube_data:/var/lib/blukube
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    tty: true

volumes:
  blukube_data:
